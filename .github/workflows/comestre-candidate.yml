name: Comestre — validar alteração TEST
on:
  pull_request:
    paths:
      - 'proposals/vlab/**'
      - 'proposals/levelup/**'
      - 'scripts/proposal_gate.py'
      - 'scripts/ci_scope.py'
      - '.github/workflows/comestre-candidate.yml'
  push:
    branches: [main]
    paths:
      - 'proposals/vlab/**'
      - 'proposals/levelup/**'
      - 'scripts/proposal_gate.py'
      - 'scripts/ci_scope.py'
      - '.github/workflows/comestre-candidate.yml'
  workflow_dispatch:
concurrency:
  # GitHub Free: a newer version of this PR supersedes its still-running predecessor.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  review_candidate:
    name: VLAB + LEVEL-UP — proposta TEST
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Identificar motor afetado pelo diff real, sem falso PASS
        id: scope
        env:
          GH_SCOPE_EVENT: ${{ github.event_name }}
          GH_SCOPE_PR_BASE: ${{ github.event.pull_request.base.sha }}
          GH_SCOPE_PR_HEAD: ${{ github.event.pull_request.head.sha }}
          GH_SCOPE_BEFORE: ${{ github.event.before }}
          GH_SCOPE_HEAD: ${{ github.sha }}
        shell: bash
        run: python -I -B scripts/ci_scope.py
      - name: Validar pacote original e preparar arquivos isolados
        id: source
        if: ${{ steps.scope.outcome == 'success' && (steps.scope.outputs.vlab == 'true' || steps.scope.outputs.levelup == 'true') }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, zipfile
          from pathlib import Path
          from scripts.native_engine_ci import PINS,verify

          bundle=Path("lab-inputs/ASSIMILACAO_NATIVE_INPUTS_R237_P12_20261021.zip")
          assert hashlib.sha256(bundle.read_bytes()).hexdigest()=="6d28bb0412be08e7b54d5725d73fc4918566e9415bfcaa66f033101cfd57ac84"
          assert bundle.exists()
          with zipfile.ZipFile(bundle) as packed:
              assert packed.testzip() is None
              assert set(packed.namelist())==set(p["name"] for p in PINS.values())|{"MANIFEST_INTEGRACAO_TEST.json"}
              for engine,p in PINS.items():
                  data=packed.read(p["name"])
                  assert hashlib.sha256(data).hexdigest()==p["sha"], "INNER_SHA_MISMATCH_"+engine
                  target=Path("lab-inputs")/p["name"]
                  target.write_bytes(data)
                  verify(target,p)
          print("ORIGINALS_PINNED_AND_VERIFIED; NO_NOTION_WRITE")
          PY
      - name: VLAB — conferir mudança real na RD (24 testes)
        id: vlab
        if: ${{ !cancelled() && steps.source.outcome == 'success' && steps.scope.outputs.vlab == 'true' }}
        shell: bash
        run: |
          set -uo pipefail
          if python -I -B scripts/proposal_gate.py --engine vlab --archive lab-inputs/VLAB_R237_LIVE_FRACO_TRANSITION_NATIVE_COLD_AUDITED_MESTRE_ONLY.zip; then
            echo '✅ VLAB R237 TEST: APROVADO — 24/24 testes originais da proposta' >> "$GITHUB_STEP_SUMMARY"
          else
            result=$?
            echo '❌ VLAB R237 TEST: REPROVADO — leia este passo, corrija a mesma PR e reexecute; original intocado' >> "$GITHUB_STEP_SUMMARY"
            exit "$result"
          fi
      - name: LEVEL-UP — conferir mudança real no custo PA (184 testes)
        id: levelup
        if: ${{ !cancelled() && steps.source.outcome == 'success' && steps.scope.outputs.levelup == 'true' }}
        shell: bash
        run: |
          set -uo pipefail
          if python -I -B scripts/proposal_gate.py --engine levelup --archive lab-inputs/IBX114_SUCESSOR_R216P12_MESTRE_CORRIGIDO_20261021_MESTRE_ONLY.zip; then
            echo '✅ LEVEL-UP P12 TEST: APROVADO — 184/184 testes originais da proposta' >> "$GITHUB_STEP_SUMMARY"
          else
            result=$?
            echo '❌ LEVEL-UP P12 TEST: REPROVADO — leia este passo, corrija a mesma PR e reexecute; fichas intactas' >> "$GITHUB_STEP_SUMMARY"
            exit "$result"
          fi
