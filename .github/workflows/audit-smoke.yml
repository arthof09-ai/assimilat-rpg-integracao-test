name: Test Integrity Auditor
# Avoid burning monthly GitHub Free minutes for purely narrative or documentation changes.
on:
  push:
    branches: [main]
    paths:
      - 'tests/**'
      - 'scripts/**'
      - 'proposals/**'
      - 'experiments/**'
      - 'lab-inputs/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'tests/**'
      - 'scripts/**'
      - 'proposals/**'
      - 'experiments/**'
      - 'lab-inputs/**'
      - '.github/workflows/**'
  workflow_dispatch:
concurrency:
  group: audit-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run strictly synthetic tests
        run: python -m unittest discover -s tests -q
      - name: Reproduce native DMG C29 numerics (TEST, no writers)
        run: python -I -B tests/run_dmg_c29_native.py
