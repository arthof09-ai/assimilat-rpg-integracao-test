name: VLAB & LEVEL-UP — Native Engines (TEST)
on:
  push:
    paths:
      - 'lab-inputs/*.zip'
      - 'scripts/native_engine_ci.py'
      - 'scripts/native_full_regression.py'
      - '.github/workflows/native-engines.yml'
  pull_request:
    paths:
      - 'lab-inputs/*.zip'
      - 'scripts/native_engine_ci.py'
      - 'scripts/native_full_regression.py'
      - '.github/workflows/native-engines.yml'
  workflow_dispatch:
    inputs:
      engine:
        description: 'Original engine to reproduce'
        required: true
        type: choice
        options:
          - available
          - vlab
          - levelup
        default: available
permissions:
  contents: read
jobs:
  native:
    name: Original source only — combat & progression
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify pinned source and run native engine
        env:
          ENGINE_SELECTION: ${{ inputs.engine || 'available' }}
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/native_engine_ci.py scripts/native_full_regression.py
          vlab='lab-inputs/VLAB_R237_LIVE_FRACO_TRANSITION_NATIVE_COLD_AUDITED_MESTRE_ONLY.zip'
          levelup='lab-inputs/IBX114_SUCESSOR_R216P12_MESTRE_CORRIGIDO_20261021_MESTRE_ONLY.zip'
          # One Android upload for both original archives; never trust name alone.
          bundle='lab-inputs/ASSIMILACAO_NATIVE_INPUTS_R237_P12_20261021.zip'
          if [[ -f "$bundle" ]]; then
            python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import zipfile

          source = Path("lab-inputs/ASSIMILACAO_NATIVE_INPUTS_R237_P12_20261021.zip")
          pinned_sha = "6d28bb0412be08e7b54d5725d73fc4918566e9415bfcaa66f033101cfd57ac84"
          assert hashlib.sha256(source.read_bytes()).hexdigest() == pinned_sha, "BUNDLE_SHA_MISMATCH"
          expected = {
              "VLAB_R237_LIVE_FRACO_TRANSITION_NATIVE_COLD_AUDITED_MESTRE_ONLY.zip":
                "49c2db6ebf8fdae8e378355c3f017e95afe879c7e29ba72086044afdd190d4de",
              "IBX114_SUCESSOR_R216P12_MESTRE_CORRIGIDO_20261021_MESTRE_ONLY.zip":
                "619fe210a2e8469df59f7db001220c97309cae79054b7574284a5047c633e4de",
          }
          with zipfile.ZipFile(source) as archive:
              names = archive.namelist()
              assert len(names) == 3 and set(names) == set(expected) | {"MANIFEST_INTEGRACAO_TEST.json"}, "BUNDLE_CONTENTS_MISMATCH"
              assert archive.testzip() is None, "BUNDLE_CRC_MISMATCH"
              for name, pinned in expected.items():
                  payload = archive.read(name)
                  assert hashlib.sha256(payload).hexdigest() == pinned, "INNER_ARCHIVE_SHA_MISMATCH:" + name
                  (Path("lab-inputs") / name).write_bytes(payload)
              manifest = json.loads(archive.read("MANIFEST_INTEGRACAO_TEST.json"))
              assert set(manifest["archives"]) == set(expected), "INNER_MANIFEST_MISMATCH"
              for name, pinned in expected.items():
                  assert manifest["archives"][name]["sha256"] == pinned, "BUNDLE_MANIFEST_SHA_MISMATCH"
          print("ONE_BUNDLE_TWO_ORIGINAL_ENGINES: HASH_PASS")
          PY
          fi
          executed=0
          if [[ "$ENGINE_SELECTION" == "vlab" || "$ENGINE_SELECTION" == "available" ]]; then
            if [[ -f "$vlab" ]]; then
              python -I -B scripts/native_engine_ci.py --engine vlab --archive "$vlab"
              python -I -B scripts/native_full_regression.py --engine vlab --archive "$vlab"
              executed=$((executed+1))
              echo 'VLAB_R237: PASS 8 battles + 215 original unit tests + 5 adversarial R18 rehash rejections' >> "$GITHUB_STEP_SUMMARY"
            elif [[ "$ENGINE_SELECTION" == "vlab" ]]; then
              echo 'VLAB_R237 archive missing; not a PASS' >&2
              exit 2
            else
              echo 'VLAB_R237: NOT PROVIDED / NOT TESTED' >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          if [[ "$ENGINE_SELECTION" == "levelup" || "$ENGINE_SELECTION" == "available" ]]; then
            if [[ -f "$levelup" ]]; then
              python -I -B scripts/native_engine_ci.py --engine levelup --archive "$levelup"
              python -I -B scripts/native_full_regression.py --engine levelup --archive "$levelup"
              executed=$((executed+1))
              echo 'LEVELUP_R216P12: PASS 184 targeted + 2026 historical module-sharded tests' >> "$GITHUB_STEP_SUMMARY"
            elif [[ "$ENGINE_SELECTION" == "levelup" ]]; then
              echo 'LEVELUP_R216P12 archive missing; not a PASS' >&2
              exit 2
            else
              echo 'LEVELUP_R216P12: NOT PROVIDED / NOT TESTED' >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          if [[ "$executed" == "0" ]]; then
            echo 'No archive provided. Neither engine was tested.' >&2
            exit 3
          fi
